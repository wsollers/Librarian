[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librarian"
version = "0.1.0"
description = "Personal mathematics library: page-exact Markdown extraction, hybrid (FTS5 + vector) search, citations by book, printed page, PDF page and line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6",
    "Pillow>=10",
    "reportlab>=4",
]

[project.optional-dependencies]
# torch comes from the PyTorch CUDA index; scripts/bootstrap.ps1 installs it first.
embed = ["sentence-transformers>=3.0", "sqlite-vec>=0.1.6"]
dev = ["pytest>=8"]

[project.scripts]
librarian = "librarian.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
