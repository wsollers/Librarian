# Copy to config/local.toml (git-ignored) or pass --config.
# Paths are as seen on hal5000.
sources = 'D:\Readings\Sources'
data    = 'D:\Readings\librarian'          # SQLite index, objects/, reports/ (never in git)
legacy  = 'D:\Readings\indexes\lra'        # old lra-* stack, read-only seed
manifest = 'F:\repos\lra-source-profiles\data\source-manifest.yaml'
publish = 'G:\My Drive\Librarian'          # phase 3: read-only published index

# Ingestion inboxes (docs/ingestion.md). '~' is your home folder.
inbox = ['~\Downloads',
         'G:\My Drive\Saved from Chrome',   # the phone's Chrome downloads
         'G:\My Drive\Input']               # phone books that land anywhere else
inbox_exclude = ['G:\My Drive\Librarian']
